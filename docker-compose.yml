version: "3.9"
services:

  redis:
    image: redis:7.2.0
    restart: always
    env_file:
      - .env.docker.development
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    ports:
      - "${DEV_HOST}:6379:6379"
    volumes:
      - redis:/data

  postgres:
    image: postgres:alpine3.19
    restart: always
    env_file:
      - .env.docker.development
    ports:
      - '${DEV_HOST}:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
networks:
  local:
    name: local
    driver: bridge

volumes:
  postgres:
  redis:
